[project]
name = "image-chat-worker"
version = "0.1.0"
description = "FLUX image worker: local server (laptop) and RunPod Serverless handler"
requires-python = ">=3.11,<3.14"
dependencies = [
    "torch>=2.8",
    "diffusers>=0.42",
    "transformers>=4.56",
    "accelerate>=1.10",
    "safetensors",
    "huggingface_hub>=0.34",
    "bitsandbytes>=0.48",  # only used by the optional 4-bit mode
    "pillow",
    "fastapi>=0.115",
    "uvicorn>=0.30",
]

[dependency-groups]
dev = ["pytest>=8"]

[tool.uv]
package = false

[tool.uv.sources]
torch = { index = "pytorch-cu128" }

[[tool.uv.index]]
name = "pytorch-cu128"
url = "https://download.pytorch.org/whl/cu128"
explicit = true

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
markers = ["gpu: needs the downloaded model and a CUDA GPU (slow)"]
addopts = "-m 'not gpu'"
